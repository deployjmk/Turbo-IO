name: Build RayNeoCompanionDevice (unsigned)

on:
  push:
    branches: [main, live-coach-v01]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/RayNeoCompanion
        run: xcodegen generate --spec project-device.yml

      - name: Generate RayneoNet declaration module (required by start.mjs flow)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p core-probe/RecoveredInterface/build/RayneoNet.swiftmodule
          xcrun swiftc -emit-module -parse-as-library -module-name RayneoNet \
            -target arm64-apple-ios16.0 -sdk "$SDK_PATH" \
            core-probe/RecoveredInterface/RayneoNet.swift \
            -emit-module-path core-probe/RecoveredInterface/build/RayneoNet.swiftmodule/arm64-apple-ios.swiftmodule

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build RayNeoCompanionDevice (unsigned, iPhone device)
        working-directory: apps/RayNeoCompanion
        run: |
          set -o pipefail
          xcodebuild \
            -project RayNeoCompanion.xcodeproj \
            -scheme RayNeoCompanionDevice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RayNeoCompanionDevice.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive | tee build/log.txt | xcbeautify || tail -80 build/log.txt

      - name: Package unsigned IPA
        working-directory: apps/RayNeoCompanion/build
        run: |
          mkdir -p Payload
          cp -R RayNeoCompanionDevice.xcarchive/Products/Applications/*.app Payload/
          zip -qry RayNeoCompanionDevice-unsigned.ipa Payload
          ls -lh RayNeoCompanionDevice-unsigned.ipa

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: RayNeoCompanionDevice-unsigned-${{ github.sha }}
          path: apps/RayNeoCompanion/build/RayNeoCompanionDevice-unsigned.ipa
          if-no-files-found: error
